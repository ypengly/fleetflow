name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fleetflow
          POSTGRES_PASSWORD: fleetflow
          POSTGRES_DB: fleetflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fleetflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      DATABASE_URL: postgresql://fleetflow:fleetflow@localhost:5432/fleetflow?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run migrations
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      - name: Unit + integration tests
        run: npm run test -w apps/api

      - name: Build
        run: npm run build
